[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vast-rcl"
version = "1.0.0"
description = "VAST: historical features with continuous candidate latents and internal OSER"
license = {file = "LICENSE"}
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn==1.5.2",
  "threadpoolctl>=3.4",
  "pyarrow>=14",
  "PyYAML>=6",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
vast = ["default_config.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp -ra"
