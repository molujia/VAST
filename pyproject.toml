[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vast-rcl"
version = "0.1.0.dev0"
description = "Interim VAST research implementation for active root-cause localization"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.12",
  "scikit-learn==1.5.2",
  "threadpoolctl>=3.4",
  "torch>=2.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp -ra"
