[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vast-rcl"
version = "3.0.0.dev0"
description = "VAST: propagation-aware active PNU root cause localization"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.4", "pandas>=2.2", "pyarrow>=16", "jsonschema>=4.0"]

[project.optional-dependencies]
text = ["sentence-transformers>=3.0"]
test = ["pytest>=8.0", "jsonschema>=4.0"]

[project.urls]
Repository = "https://github.com/molujia/VAST"
Issues = "https://github.com/molujia/VAST/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vast_v3*"]

[tool.setuptools.package-data]
"vast_v3.annotations" = ["schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
